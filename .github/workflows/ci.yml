name: Client CI

on:
   push:
      branches:
         - main
   pull_request:

jobs:
   verify:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup pnpm
           run: |
              corepack enable
              corepack prepare pnpm@10.6.5 --activate

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Enforce pnpm lockfile only
           run: sh ./scripts/check-no-package-lock.sh

         - name: Lint
           run: pnpm lint

         - name: Build
           run: pnpm build
